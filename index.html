<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dragon Deck</title>
<style>
:root{--bg:#18261d;--ink:#f3f1ea;--panel:rgba(20,30,24,.82);--accent:#9b1b27;--gold:#e6c36a;--bad:#ff8a7a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif}
#view{position:fixed;inset:0;touch-action:none}
#hud{position:fixed;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;gap:12px;pointer-events:none}
h1{margin:0;font:600 20px Georgia,serif;letter-spacing:.02em}
#rule{margin:2px 0 0;opacity:.75;font-size:14px}
#tally{text-align:right;font-variant-numeric:tabular-nums}
#tally b{font:600 22px Georgia,serif;color:var(--gold);display:block}
#panel{position:fixed;left:16px;right:16px;bottom:16px;margin:0 auto;max-width:560px;padding:12px 14px;border-radius:12px;background:var(--panel);backdrop-filter:blur(4px);text-align:center}
#status{font-size:17px;min-height:1.4em;font-variant-numeric:tabular-nums}
#status.bad{color:var(--bad)}
#detail{opacity:.8;font-size:14px;min-height:1.4em}
#buttons{display:flex;gap:8px;justify-content:center;margin-top:8px}
button{font:inherit;padding:9px 18px;border-radius:8px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:var(--ink);cursor:pointer}
button.pri{background:var(--accent);border-color:transparent}
button:disabled{opacity:.45;cursor:default}
button[hidden]{display:none}
</style>
</head>
<body>
<div id="view"></div>
<header id="hud">
 <div><h1>Dragon Deck</h1><p id="rule">A = 1 · J, Q, K = 11</p></div>
 <div id="tally"><span id="round">Round 1 of 5</span><b id="score">0</b></div>
</header>
<div id="panel">
 <div id="status">Shuffling…</div>
 <div id="detail"></div>
 <div id="buttons">
  <button id="play" class="pri" disabled>Play</button>
  <button id="clear" disabled>Clear</button>
  <button id="next" class="pri" hidden>Next round</button>
 </div>
</div>
<!-- 1. the card artwork, the rules, and the shared 3D table -->
<script src="artwork.js"></script>
<script src="cardArt.js"></script>
<script src="rules.js"></script>
<script src="table.js"></script>
<!-- 2. where to download three.js, the 3D library -->
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<!-- 3. the game: deal, pick cards, score -->
<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";
import {RoomEnvironment} from "three/addons/environments/RoomEnvironment.js";

const T=await Table.create(THREE,{OrbitControls,RoomEnvironment},document.getElementById("view"));
const {cards,order,CT,move,wait,tween}=T;
const $=id=>document.getElementById(id);

/* ---------- where things sit on the table ---------- */
Object.assign(T.deckAt,{x:-4.6,z:-2.2});    // the deck, back left
const DISCARD={x:4.6,z:-2.2};               // used cards, back right
const TARGET={x:0,z:-2.2};                  // the target number, back centre
const slotX=i=>(i-2)*2.9;                   // the five hand spots, in a row at the front
const HAND_Z=3.4,PICKED_Z=1.7;              // picked cards slide forward, toward the target
T.frame(15,12,1.4,0);                       // aim the camera so this 15 x 12 area fills the screen (leaving room for the panel)

/* ---------- the target number: a round red-and-gold token with the number painted on top ---------- */
const tokenCanvas=document.createElement("canvas");tokenCanvas.width=tokenCanvas.height=512;
const tokenTex=new THREE.CanvasTexture(tokenCanvas);tokenTex.colorSpace=THREE.SRGBColorSpace;
function paintToken(n){
  const g=tokenCanvas.getContext("2d"),c=256;
  g.clearRect(0,0,512,512);
  g.fillStyle="#c9a24a";g.beginPath();g.arc(c,c,256,0,7);g.fill();                // gold rim
  const red=g.createRadialGradient(c,c-60,20,c,c,230);red.addColorStop(0,"#b3202f");red.addColorStop(1,"#5e0c16");
  g.fillStyle=red;g.beginPath();g.arc(c,c,226,0,7);g.fill();                        // red centre
  g.strokeStyle="#e6c36a";g.lineWidth=5;g.beginPath();g.arc(c,c,206,0,7);g.stroke();// thin inner ring
  g.fillStyle="#f4dc94";g.textAlign="center";g.textBaseline="middle";
  g.font="600 40px Georgia,serif";g.fillText("TARGET",c,c-128);
  g.font="700 220px Georgia,serif";g.fillText(n,c,c+24);
  tokenTex.needsUpdate=true;
}
const brass=new THREE.MeshStandardMaterial({color:0xc9a24a,metalness:.8,roughness:.35});
const token=new THREE.Mesh(new THREE.CylinderGeometry(1.6,1.6,.16,64),[brass,new THREE.MeshStandardMaterial({map:tokenTex,roughness:.5,metalness:.2}),brass]);
token.castShadow=token.receiveShadow=true; // the top face of the cylinder carries the picture
const FACING=Math.PI/2; // turn the token so its writing reads the right way up from your seat
token.position.set(TARGET.x,.08,TARGET.z);token.scale.setScalar(.001);T.scene.add(token);
// pop up: grow from nothing while spinning once
function showToken(n){
  paintToken(n);
  return tween(.7,0,p=>{const k=T.smooth(p);token.scale.setScalar(Math.max(.001,k));token.rotation.y=FACING+(1-k)*Math.PI*2;token.position.y=.08+Math.sin(p*Math.PI)*1.2});
}
function hideToken(){
  const s=token.scale.x;
  return tween(.3,0,p=>token.scale.setScalar(Math.max(.001,s*(1-p))));
}

/* ---------- the game's memory ("state") ---------- */
const game={round:0,score:0,target:0,hand:[],picked:new Set(),discard:[],phase:"busy"};
// phase: "busy" while things animate, "pick" while the player chooses, "result" after a play, "over" at the end
const valueOf=c=>Rules.value(c.userData.rank);
const pickedCards=()=>game.hand.filter(c=>game.picked.has(c)); // in left-to-right order
let bestEver=0;try{bestEver=+localStorage.getItem("dragonDeckBest")||0}catch{}

/* ---------- the screen text and buttons ---------- */
function show(status,detail="",bad=false){$("status").textContent=status;$("detail").textContent=detail;$("status").classList.toggle("bad",bad)}
function showButtons({play=false,clear=false,next=null}){
  $("play").hidden=$("clear").hidden=!!next;$("next").hidden=!next;
  $("play").disabled=!play;$("clear").disabled=!clear;
  if(next)$("next").textContent=next;
}
function showTally(){$("round").textContent=`Round ${Math.max(1,game.round)} of ${Rules.ROUNDS}`;$("score").textContent=game.score}
// while picking: show the sum so far and whether it can be played
function showPicking(){
  const vals=pickedCards().map(valueOf),r=Rules.score(game.target,vals);
  showButtons({play:r.valid,clear:vals.length>0});
  if(!vals.length)return show(`Make ${game.target} or just under`,`Tap 2 to 5 cards. More cards = more points.`);
  const sum=`${vals.join(" + ")} = ${r.sum}`;
  if(r.gap<0)return show(sum,`Over by ${-r.gap}. Take a card out.`,true);
  if(vals.length<Rules.MIN_CARDS)return show(sum,"Pick at least one more card");
  show(sum,`${r.gap?r.gap+" short":"Exact!"} · ${r.cards} cards ×${r.mult} → ${r.points} points`);
}

/* ---------- moving cards around ---------- */
function placeHandCard(c,{dur=.25}={}){
  const i=game.hand.indexOf(c),up=game.picked.has(c);
  c.userData.face.material.emissive.setHex(up?0x3a2a00:0x000000); // a faint gold glow on picked cards
  return move(c,slotX(i),CT/2,up?PICKED_Z:HAND_Z,0,true,{dur,hop:.2});
}
async function dealHand(){
  game.hand=order.splice(-Rules.HAND).reverse(); // take the top five cards off the deck
  await Promise.all(game.hand.map((c,i)=>move(c,slotX(i),CT/2,HAND_Z,0,false,{dur:.5,delay:i*.15,hop:.6})));
  for(const c of game.hand)await move(c,c.position.x,CT/2,HAND_Z,0,true,{dur:.35});
}
function discardHand(){
  const moving=game.hand.map((c,i)=>{
    c.userData.face.material.emissive.setHex(0);
    const n=game.discard.push(c)-1;
    return move(c,DISCARD.x+(Math.random()-.5)*.3,CT/2+n*CT*1.02,DISCARD.z+(Math.random()-.5)*.3,(Math.random()-.5)*.5,true,{dur:.45,delay:i*.06,hop:.5});
  });
  game.hand=[];game.picked.clear();
  return Promise.all(moving);
}

/* ---------- the game loop: new game → rounds (deal, pick, score) → final score ---------- */
async function newGame(){
  game.phase="busy";showButtons({});show("Shuffling…");
  game.round=0;game.score=0;showTally();
  await hideToken();
  order.length=0;order.push(...cards);game.discard=[];game.hand=[];game.picked.clear(); // every card back in the deck
  for(const c of cards)c.userData.face.material.emissive.setHex(0);
  await T.shuffle();
  await nextRound();
}
async function nextRound(){
  game.phase="busy";showButtons({});
  if(game.hand.length)await Promise.all([discardHand(),hideToken()]);
  game.round++;showTally();
  // peek at the next five cards to choose a target that can be reached, then show the target before dealing
  const coming=order.slice(-Rules.HAND).map(valueOf);
  game.target=Rules.makeTarget(coming);
  show("Your target…");
  await showToken(game.target);
  await wait(.25);
  await dealHand();
  game.phase="pick";showPicking();
}
function togglePick(c){
  if(game.phase!=="pick"||!game.hand.includes(c))return;
  if(game.picked.has(c))game.picked.delete(c);else game.picked.add(c);
  placeHandCard(c);showPicking();
}
async function play(){
  const vals=pickedCards().map(valueOf),r=Rules.score(game.target,vals);
  if(game.phase!=="pick"||!r.valid)return;
  game.phase="busy";showButtons({});
  // unpicked cards slide back and turn over, so the scoring cards stand out
  await Promise.all(game.hand.filter(c=>!game.picked.has(c)).map(c=>move(c,c.position.x,CT/2,HAND_Z+.4,0,false,{dur:.4})));
  game.score+=r.points;showTally();
  const best=Rules.best(game.target,game.hand.map(valueOf));
  const how=`${r.exact?"Exact!":r.gap+" short:"} ${r.close} × ${r.mult} (${r.cards} cards) = ${r.points} points`;
  const beat=r.points>=best.points?"That was the best possible play!":`Best possible: ${best.pick.map(i=>valueOf(game.hand[i])).join(" + ")} = ${best.sum} for ${best.points}`;
  show(how,beat);
  game.phase="result";
  showButtons({next:game.round<Rules.ROUNDS?"Next round":"Final score"});
}
async function finish(){
  game.phase="busy";showButtons({});
  await Promise.all([discardHand(),hideToken()]);
  const record=game.score>bestEver;
  if(record){bestEver=game.score;try{localStorage.setItem("dragonDeckBest",bestEver)}catch{}}
  show(`Final score: ${game.score}`,record?"A new best!":`Your best: ${bestEver}`);
  game.phase="over";showButtons({next:"Play again"});
}

/* ---------- hooking up taps and buttons ---------- */
T.onTap(togglePick);
$("play").onclick=play;
$("clear").onclick=()=>{if(game.phase!=="pick")return;const was=pickedCards();game.picked.clear();was.forEach(c=>placeHandCard(c));showPicking()};
$("next").onclick=()=>{if(game.phase==="result")game.round<Rules.ROUNDS?nextRound():finish();else if(game.phase==="over")newGame()};

window.__game={game,togglePick,play,next:()=>$("next").click()}; // hooks for automated testing and screenshots
newGame();
</script>
</body>
</html>
